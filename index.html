<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DINDA KAYA JEMBUT</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

.centerText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:60px;
    font-weight:bold;
    text-shadow:
    0 0 10px red,
    0 0 20px red,
    0 0 40px red,
    0 0 80px red;
    z-index:10;
}
</style>
</head>

<body>

<div class="centerText">dinda kaya jembut</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles=[];

function heart(t){
    return {
        x:16*Math.pow(Math.sin(t),3),
        y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
    };
}

for(let i=0;i<800;i++){

    let t=Math.random()*Math.PI*2;
    let p=heart(t);

    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,

        tx:canvas.width/2+p.x*18,
        ty:canvas.height/2+p.y*18
    });
}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{

        p.x+=(p.tx-p.x)*0.02;
        p.y+=(p.ty-p.y)*0.02;

        ctx.fillStyle="#ff003c";
        ctx.font="10px Arial";

        ctx.shadowColor="#ff003c";
        ctx.shadowBlur=15;

        ctx.fillText("I LOVE YOU",p.x,p.y);
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
